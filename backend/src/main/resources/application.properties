# ============================================================
# NEXORA - Phase 1 Configuration
# ============================================================

spring.application.name=nexora

# ------------------------------------------------------------
# SERVER
# ------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------
# MYSQL DATABASE CONNECTION
# ------------------------------------------------------------
# Create the database first by running in MySQL:
#   CREATE DATABASE nexora_db;
#
# Update username/password to match your local MySQL setup.
spring.datasource.url=jdbc:mysql://localhost:3306/nexora_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=jeet1972
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------
# ddl-auto=update -> Hibernate will auto-create/update tables based on
# our @Entity classes. This is convenient for learning/dev.
# In real production systems we normally switch this to "validate"
# and manage schema changes with a migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------
# JACKSON (JSON) - keep API responses clean
# ------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------
logging.level.com.nexora=DEBUG
logging.level.org.hibernate.SQL=DEBUG
