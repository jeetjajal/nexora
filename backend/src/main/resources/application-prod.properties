# ============================================================
# NEXORA — Production Profile Configuration (application-prod.properties)
# Active when SPRING_PROFILES_ACTIVE=prod
# ============================================================

spring.application.name=nexora

# Server Port (Dynamic PaaS assignment with 8080 fallback)
server.port=${PORT:8080}

# Managed MySQL Connection
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${NEXORA_DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP Production Tuning)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=NexoraProdHikariPool

# Strict Schema Validation (Hibernate does not auto-mutate production tables)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migrations (Authoritative schema management)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Production JWT Configuration
nexora.jwt.secret=${NEXORA_JWT_SECRET}
nexora.jwt.access-token-expiration-ms=3600000
nexora.jwt.refresh-token-expiration-ms=604800000

# Payments (Razorpay Production / Test Key)
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# Production Logging
logging.level.com.nexora=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO

# Observability & Production Probes
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
