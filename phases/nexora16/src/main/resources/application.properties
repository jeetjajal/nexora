# ============================================================
# NEXORA - Phase 1 Configuration
# ============================================================

spring.application.name=nexora

# ------------------------------------------------------------
# SERVER
# ------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------
# MYSQL DATABASE CONNECTION
# ------------------------------------------------------------
# Create the database first by running in MySQL:
#   CREATE DATABASE nexora_db;
#
# Update username/password to match your local MySQL setup.
spring.datasource.url=jdbc:mysql://localhost:3306/nexora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=nexora_user
spring.datasource.password=jeet0704
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------
# ddl-auto=update -> Hibernate will auto-create/update tables based on
# our @Entity classes. This is convenient for learning/dev.
# In real production systems we normally switch this to "validate"
# and manage schema changes with a migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------
# JACKSON (JSON) - keep API responses clean
# ------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------
# JWT (Phase 3)
# ------------------------------------------------------------
# NEVER hard-code a real secret and commit it. In development, the
# fallback value after ":" is used if the NEXORA_JWT_SECRET
# environment variable isn't set, purely so the app runs out of the
# box while learning. Before any real deployment, set a strong random
# secret as an environment variable instead of relying on this default.
#
# Generate one yourself, e.g. in a terminal:
#   openssl rand -base64 64
nexora.jwt.secret=${NEXORA_JWT_SECRET:dev-only-please-override-this-secret-before-deploying-anywhere-real-1234567890}

# Access token validity: 1 hour (in milliseconds)
nexora.jwt.access-token-expiration-ms=3600000

# Refresh token validity: 7 days (in milliseconds) — issued now,
# actually consumed by a POST /api/v1/auth/refresh endpoint in a
# later phase once refresh-token rotation/storage is designed.
nexora.jwt.refresh-token-expiration-ms=604800000

# ------------------------------------------------------------
# ORDERS (Phase 8)
# ------------------------------------------------------------
# Flat delivery fee applied to every order, regardless of distance.
# This is intentionally simple for now — Phase 12 (Delivery System)
# introduces real delivery-partner assignment; a distance-based or
# time-based fee could be layered on top of that later without
# changing anything about how Order itself stores/reports the fee.
nexora.order.delivery-fee=40.00

# ------------------------------------------------------------
# PAYMENTS — RAZORPAY (Phase 9)
# ------------------------------------------------------------
# NEVER commit real credentials. Get TEST MODE keys from your own
# Razorpay dashboard: Settings -> API Keys -> Generate Test Key.
# Test-mode key ids start with "rzp_test_". Real money is never
# involved in test mode — Razorpay provides dummy card/UPI details
# for simulating both successful and failed payments.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_replace_with_your_key_id}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:replace_with_your_key_secret}

# PHASE 10: a SEPARATE secret from key-secret above, configured in the
# Razorpay dashboard specifically for webhooks (Settings -> Webhooks ->
# create a webhook -> set a secret there). Used only to verify the
# X-Razorpay-Signature header on incoming webhook calls — see
# RazorpaySignatureVerifier's javadoc for why this is a different
# secret from the API key secret.
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:replace_with_your_webhook_secret}

# ------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------
logging.level.com.nexora=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG

# ------------------------------------------------------------
# APACHE KAFKA (Phase 16)
# ------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=nexora-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.listener.auto-startup=${KAFKA_AUTO_STARTUP:false}

# Nexora Kafka Topics
nexora.kafka.topics.order-events=nexora.order-events
nexora.kafka.topics.payment-events=nexora.payment-events
nexora.kafka.topics.delivery-events=nexora.delivery-events
nexora.kafka.topics.dead-letter=nexora.dead-letter-topic

