groups:
  - name: NexoraCriticalAlerts
    rules:
      - alert: HighHttpErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate exceeds 5%"
          description: "Service error rate on cluster is currently high."

      - alert: P99LatencySpike
        expr: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "P99 Latency exceeds 1500ms"
          description: "Search and checkout endpoints latency degraded."

      - alert: PaymentFailureSpike
        expr: increase(nexora_payments_failure_total[5m]) > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Payment failures spiking"
          description: "Payment gateway error rate elevated."

      - alert: KafkaConsumerLagHigh
        expr: sum(kafka_consumergroup_lag{topic="nexora.order-events"}) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka Consumer lag high"
          description: "Order processing consumers lag exceeds 500 events."
