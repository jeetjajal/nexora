apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-config
  namespace: nexora-production
data:
  SPRING_PROFILES_ACTIVE: "production"
  SERVER_PORT: "8080"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql.nexora-production.svc.cluster.local:3306/nexora_db?useSSL=false&serverTimezone=UTC"
  SPRING_DATA_REDIS_HOST: "redis.nexora-production.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.nexora-production.svc.cluster.local:9092"
  SPRING_ELASTICSEARCH_URIS: "http://elasticsearch.nexora-production.svc.cluster.local:9200"
