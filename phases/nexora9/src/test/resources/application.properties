# ============================================================
# TEST CONFIGURATION — used automatically by any test annotated
# @DataJpaTest / @SpringBootTest, since Spring Boot picks up
# src/test/resources/application.properties for the test classpath.
#
# We point tests at an in-memory H2 database instead of MySQL so the
# test suite can run anywhere (including CI) without a MySQL server.
# The production app (src/main/resources/application.properties)
# still uses real MySQL — this file ONLY affects `mvn test`.
# ============================================================

# PHASE 9: activates the "test" Spring profile for the whole suite,
# which excludes RazorpayGatewayClientImpl (see its @Profile("!test"))
# in favor of StubPaymentGatewayClient — no test anywhere makes a real
# network call to Razorpay, and no test needs real credentials.
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:nexora_test;DB_CLOSE_DELAY=-1;MODE=MySQL;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# PHASE 6: the inventory concurrency tests deliberately fire up to 20
# threads at once, each needing its own database connection to run a
# genuinely simultaneous transaction. The default Hikari pool (10)
# would make several of them queue for a free connection, which
# doesn't break correctness but adds unnecessary serialization noise
# to a test that's specifically trying to prove behavior UNDER real
# concurrency. LOCK_TIMEOUT=10000 (above) similarly gives H2's row
# locking generous headroom under that same burst of contention.
spring.datasource.hikari.maximum-pool-size=25

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ------------------------------------------------------------
# JWT (Phase 3) — a fixed test-only secret so token generation/
# validation tests are 100% reproducible and never depend on an
# environment variable being set in CI or on a teammate's machine.
# ------------------------------------------------------------
nexora.jwt.secret=test-only-secret-not-used-anywhere-real-abcdefghijklmnopqrstuvwxyz123456
nexora.jwt.access-token-expiration-ms=3600000
nexora.jwt.refresh-token-expiration-ms=604800000

# ------------------------------------------------------------
# ORDERS (Phase 8)
# ------------------------------------------------------------
nexora.order.delivery-fee=40.00

# ------------------------------------------------------------
# PAYMENTS (Phase 9) — placeholders only. The real RazorpayGatewayClientImpl
# is excluded under the "test" profile (see spring.profiles.active above),
# so these values are never actually used to contact Razorpay, but are
# defined so @Value resolution never fails if anything references them.
# ------------------------------------------------------------
razorpay.key-id=rzp_test_placeholder_not_used_in_tests
razorpay.key-secret=placeholder_not_used_in_tests
