# ============================================================
# TEST CONFIGURATION
# ============================================================

spring.datasource.url=jdbc:h2:mem:nexora_test;DB_CLOSE_DELAY=-1;MODE=MySQL;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hikari connection pool
spring.datasource.hikari.maximum-pool-size=25

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ------------------------------------------------------------
# JWT
# ------------------------------------------------------------

nexora.jwt.secret=test-only-secret-not-used-anywhere-real-abcdefghijklmnopqrstuvwxyz123456
nexora.jwt.access-token-expiration-ms=3600000
nexora.jwt.refresh-token-expiration-ms=604800000

# ------------------------------------------------------------
# ORDERS
# ------------------------------------------------------------

nexora.order.delivery-fee=40.00

# ------------------------------------------------------------
# HIBERNATE SQL PARAMETER LOGGING
# ------------------------------------------------------------

logging.level.org.hibernate.orm.jdbc.bind=TRACE